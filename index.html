  if(v.pe && v.peHist){ var ratio=v.pe/v.peHist; score += ratio<0.8?10:ratio<1?8:ratio<1.2?6:4; count++; }
  // EV/EBITDA < 15 = atrativo
  if(v.evEbitda){ score += v.evEbitda<10?10:v.evEbitda<15?8:v.evEbitda<20?6:v.evEbitda<30?4:2; count++; }
  // DCF vs preço atual (margem de segurança)
  if(v.dcf){ var mkt=ST.mktCache[ticker]; if(mkt&&mkt.ok){ var ms=(v.dcf-parseFloat(mkt.price))/v.dcf*100; score += ms>30?10:ms>15?8:ms>0?6:ms>-15?4:2; count++; } }
  return count>0 ? +(score/count).toFixed(1) : null;
}

function getMargemSeguranca(ticker){
  var v = VALUATION[ticker];
  if(!v||!v.dcf) return null;
  var mkt = ST.mktCache[ticker];
  if(!mkt||!mkt.ok) return null;
  var preco = parseFloat(mkt.price);
  return +((v.dcf - preco)/v.dcf*100).toFixed(1);
}

function getValuationBadge(ticker){
  var v = VALUATION[ticker];
  if(!v) return null;
  var vs = getValuationScore(ticker);
  if(vs == null) return null;
  if(vs >= 8) return {l:"Atrativo",co:"#059669",bg:"#ecfdf5"};
  if(vs >= 6) return {l:"Justo",co:"#d97706",bg:"#fffbeb"};
  return {l:"Esticado",co:"#dc2626",bg:"#fef2f2"};
}

// ── FIM VALUATION ───────────────────────────────

function getScore(a){
  var cs=ST.customScores[a.t]||{};
  var sc=Object.assign({},a.scores,cs);
  var w={dominancia:.06,moat:.07,receitaRecorrente:.05,crescReceita:.07,crescLucro:.06,fluxoCaixa:.06,saudeFinanceira:.05,margemOp:.05,roe:.04,escalabilidade:.05,poderPreco:.04,gestao:.04,capexIA:.08,inovacao:.06,resiliencia:.05,volatilidade:.04,potencialLP:.06,relevanciafutura:.06,divida:.03,eficiencia:.03};
  var tot=0,tw=0;
  Object.keys(w).forEach(function(k){if(sc[k]!=null){tot+=sc[k]*w[k];tw+=w[k];}});
  return tw>0?+(tot/tw).toFixed(2):a.s;
}

function getTrend(t,fb){
  var m=ST.mktCache[t];
  if(m&&m.ok&&m.hist&&m.hist.length>=10){
    var p=m.hist.map(function(h){return h.p;});
    var r=p.slice(-5).reduce(function(a,b){return a+b;},0)/5;
    var o=p.slice(0,5).reduce(function(a,b){return a+b;},0)/5;
    var pct=(r-o)/o;
    if(pct>.03)return .2;if(pct>.01)return .1;if(pct<-.03)return -.2;if(pct<-.01)return -.1;return 0;
  }
  return fb;
}

function getRec(a){
  var s=getScore(a);
  var sc=Object.assign({},a.scores,ST.customScores[a.t]||{});
  var pos=(ST.posicoes[a.t]||0)>0; // usa posição real do estado
  if(s>=9.5&&sc.moat>=9.5)return"COMPRAR";
  if(s>=9.2&&getTrend(a.t,a.tr)>=.1&&sc.capexIA>=9.0)return"COMPRAR";
  if(sc.capexIA>=9.5&&sc.crescReceita>=9.0)return"COMPRAR";
  if(s>=8.8&&!pos)return"INICIAR";
  if(s>=8.5&&getTrend(a.t,a.tr)>=0&&a.r==="BAIXO")return"MANTER";
  if(s>=7.5&&Math.abs(getTrend(a.t,a.tr))<.15)return"MANTER";
  if(s>=7.0&&s<8.5&&getTrend(a.t,a.tr)<0&&pos)return"REDUZIR";
  if(a.r==="ALTO"&&s<8.5&&pos)return"REDUZIR";
  if(s<7.5&&getTrend(a.t,a.tr)<=-0.1&&pos)return"VENDER";
  return"MANTER";
}

function calcAlloc(cap){
  var lims={TECH:{mn:.03,mx:.22},INFRA:{mn:.03,mx:.20},RISCO:{mn:.01,mx:.08},ETF:{mn:.05,mx:.20},RENDA:{mn:.05,mx:.18}};
  var w=ASSETS.map(function(a){var sc=getScore(a);return Object.assign({},a,{sc:sc,w:sc*(a.r==="ALTO"?.5:a.r==="MÉDIO"?.75:1)});});
  var tot=w.reduce(function(s,a){return s+a.w;},0);
  var lim=w.map(function(a){var l=lims[a.c]||{mn:.01,mx:.18};return Object.assign({},a,{pct:Math.min(Math.max(a.w/tot,l.mn),l.mx)});});
  var tl=lim.reduce(function(s,a){return s+a.pct;},0);
  return lim.map(function(a){return Object.assign({},a,{pct:+(a.pct/tl*100).toFixed(1),val:+((a.pct/tl)*cap).toFixed(0)});}).sort(function(a,b){return b.sc-a.sc;});
}

function avgScore(al){var tw=al.reduce(function(s,a){return s+a.pct;},0);return+(al.reduce(function(s,a){return s+a.sc*a.pct;},0)/tw).toFixed(1);}
function fm(v){if(v>=1e9)return"$"+(v/1e9).toFixed(1)+"B";if(v>=1e6)return"$"+(v/1e6).toFixed(1)+"M";return"R$"+Math.round(v).toLocaleString("pt-BR");}
function fmp(v){if(!v&&v!==0)return"—";return"R$"+(v>=1e6?(v/1e6).toFixed(2)+"M":(v>=1e3?(v/1e3).toFixed(0)+"k":v.toFixed(0)));}
function sfn(){var d=[],p=ST.s0;for(var y=0;y<=ST.sY;y++){d.push({y:y,v:Math.round(p)});for(var m=0;m<12;m++)p=p*(1+ST.sR/100/12)+ST.sM;}return d;}

function drawLine(id,data,co,h){
  var cv=document.getElementById(id);if(!cv)return;
  var W=cv.parentElement?cv.parentElement.offsetWidth:320;if(W<10)W=320;
  cv.width=W;cv.height=h||160;
  var ctx=cv.getContext("2d"),vals=data.map(function(d){return d.v;}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=mx-mn||1;
  var pt={t:8,b:22,l:52,r:6},cw=W-pt.l-pt.r,ch=cv.height-pt.t-pt.b;
  ctx.clearRect(0,0,W,cv.height);
  [0,.5,1].forEach(function(f){var y=pt.t+ch*(1-f);ctx.strokeStyle="#f1f5f9";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pt.l,y);ctx.lineTo(W-pt.r,y);ctx.stroke();ctx.fillStyle="#94a3b8";ctx.font="9px -apple-system,sans-serif";ctx.textAlign="right";ctx.fillText(fmp(mn+rng*f),pt.l-4,y+3);});
  ctx.beginPath();data.forEach(function(d,i){var x=pt.l+i/(data.length-1)*cw,y=pt.t+ch*(1-(d.v-mn)/rng);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.strokeStyle=co;ctx.lineWidth=2.5;ctx.stroke();
  ctx.lineTo(pt.l+cw,pt.t+ch);ctx.lineTo(pt.l,pt.t+ch);ctx.closePath();ctx.fillStyle=co+"18";ctx.fill();
  var step=Math.max(1,Math.ceil(data.length/5));ctx.fillStyle="#94a3b8";ctx.font="9px -apple-system,sans-serif";ctx.textAlign="center";
  data.forEach(function(d,i){if(i%step===0||i===data.length-1){var x=pt.l+i/(data.length-1)*cw;ctx.fillText("Ano "+d.y,x,cv.height-4);}});
}

function drawMini(id,hist,co){
  var cv=document.getElementById(id);if(!cv||!hist||hist.length<2)return;
  var W=cv.parentElement?cv.parentElement.offsetWidth:80;if(W<10)W=80;cv.width=W;cv.height=32;
  var ctx=cv.getContext("2d"),vals=hist.map(function(h){return h.p;}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=mx-mn||1;
  ctx.clearRect(0,0,W,32);ctx.beginPath();
  hist.forEach(function(h,i){var x=i/(hist.length-1)*W,y=2+(1-(h.p-mn)/rng)*28;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.strokeStyle=co;ctx.lineWidth=1.5;ctx.stroke();
}

function drawPie(id,data){
  var cv=document.getElementById(id);if(!cv)return;
  var W=cv.parentElement?cv.parentElement.offsetWidth:280;if(W<10)W=280;cv.width=W;cv.height=150;
  var ctx=cv.getContext("2d"),R=60,cx=W/2,cy=75,tot=data.reduce(function(s,d){return s+d.v;},0),ang=-Math.PI/2;
  ctx.clearRect(0,0,W,150);
  data.forEach(function(d){var sl=(d.v/tot)*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,ang,ang+sl);ctx.closePath();ctx.fillStyle=d.co;ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
  var mid=ang+sl/2,lx=cx+Math.cos(mid)*R*.65,ly=cy+Math.sin(mid)*R*.65;ctx.fillStyle="#fff";ctx.font="bold 11px -apple-system,sans-serif";ctx.textAlign="center";ctx.fillText(d.v.toFixed(0)+"%",lx,ly+4);ang+=sl;});
}

function fetchMarket(force){
  if(!force&&Date.now()-ST.mktTs<TTL&&Object.keys(ST.mktCache).length){toast("📦 Cache: "+mktAge());return;}
  ST.loadMkt=true;render();

  // Se tem backend Netlify usa ele; caso contrário usa proxy público
  if(BASE){
    var tickers=ASSETS.map(function(a){return a.t;}).join(",");
    fetch(BASE+"/market?tickers="+tickers)
      .then(function(r){return r.json();})
      .then(function(d){if(d.ok){sv("mktCache",d.data);sv("mktTs",Date.now());toast("✅ Cotações atualizadas!");}ST.loadMkt=false;render();})
      .catch(function(){ST.loadMkt=false;render();toast("⚠️ Erro ao buscar cotações");});
    return;
  }

  // Sem backend — busca individual via Yahoo Finance (CORS permitido em alguns browsers)
  var cache={},done=0,total=ASSETS.length;
  ASSETS.forEach(function(a){
    var url="https://query1.finance.yahoo.com/v8/finance/chart/"+a.t+"?interval=1d&range=1mo";
    fetch(url)
      .then(function(r){return r.json();})
      .then(function(d){
        try{
          var q=d.chart.result[0];
          var meta=q.meta;
          var closes=q.indicators.quote[0].close.filter(Boolean);
          var prev=closes.length>1?closes[closes.length-2]:meta.regularMarketPrice;
          var price=meta.regularMarketPrice;
          var change=prev?+((price-prev)/prev*100).toFixed(2):0;
          cache[a.t]={ok:true,price:price.toFixed(2),change:change,currency:meta.currency,
            high52:meta.fiftyTwoWeekHigh?meta.fiftyTwoWeekHigh.toFixed(2):null,
            low52:meta.fiftyTwoWeekLow?meta.fiftyTwoWeekLow.toFixed(2):null,
            hist:closes.slice(-20).map(function(p){return{p:p};})};
        }catch(e){cache[a.t]={ok:false};}
        done++;
        if(done===total){sv("mktCache",cache);sv("mktTs",Date.now());ST.loadMkt=false;toast("✅ Cotações atualizadas!");render();}
      })
      .catch(function(){
        cache[a.t]={ok:false};done++;
        if(done===total){sv("mktCache",cache);ST.loadMkt=false;render();}
      });
  });
}

function safeVal(v,fb,min,max){if(v==null)return fb;var n=parseFloat(v);if(isNaN(n)||n<min||n>max)return fb;return+n.toFixed(2);}

function fetchMacro(){
  ST.loadMac=true;render();

  function applyMacro(m){
    var selicVal=safeVal(m.selic&&m.selic.value,14.75,1,30);
    var ipcaVal =safeVal(m.ipca&&m.ipca.value,0.56,0,5);
    var usdVal  =safeVal(m.usd&&m.usd.value,5.72,3,15);
    sv("macro",{
      selic:String(selicVal),selicDate:(m.selic&&m.selic.date)||"—",
      ipca:String(ipcaVal),  ipcaDate:(m.ipca&&m.ipca.date)||"—",
      usd:String(usdVal),    usdDate:(m.usd&&m.usd.date)||"—",
      source:"Banco Central do Brasil"
    });
    toast("✅ Macro atualizado (BCB)!");
    ST.loadMac=false;render();
  }

  // Se tem backend Netlify — usa ele
  if(BASE){
    fetch(BASE+"/macro")
      .then(function(r){return r.json();})
      .then(function(d){if(d.ok)applyMacro(d.data);else ST.loadMac=false;render();})
      .catch(function(){ST.loadMac=false;render();});
    return;
  }

  // Sem backend — chama BCB diretamente (CORS aberto)
  var results={selic:{value:14.75,date:"—"},ipca:{value:0.56,date:"—"},usd:{value:5.72,date:"—"}};
  var done=0;
  function check(){done++;if(done===3)applyMacro(results);}

  // SELIC meta — série 432
  fetch("https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json")
    .then(function(r){return r.json();})
    .then(function(d){if(d&&d[0])results.selic={value:+parseFloat(d[0].valor).toFixed(2),date:d[0].data};check();})
    .catch(function(){check();});

  // IPCA — série 433
  fetch("https://api.bcb.gov.br/dados/serie/bcdata.sgs.433/dados/ultimos/1?formato=json")
    .then(function(r){return r.json();})
    .then(function(d){if(d&&d[0])results.ipca={value:+parseFloat(d[0].valor).toFixed(2),date:d[0].data};check();})
    .catch(function(){check();});

  // USD — série 1
  fetch("https://api.bcb.gov.br/dados/serie/bcdata.sgs.1/dados/ultimos/1?formato=json")
    .then(function(r){return r.json();})
    .then(function(d){if(d&&d[0])results.usd={value:+parseFloat(d[0].valor).toFixed(2),date:d[0].data};check();})
    .catch(function(){check();});
}

function calcPatrimonio(){
  // Calcula patrimônio acumulado ao longo dos aportes
  var hist = ST.history.slice().reverse(); // ordem cronológica
  var total = 0;
  return hist.map(function(e){
    total += e.capital;
    return {date:e.date, aporte:e.capital, acumulado:total, score:e.score};
  });
}

function drawTimeline(id, data){
  var cv = document.getElementById(id);
  if(!cv || data.length < 1) return;
  var W = cv.parentElement ? cv.parentElement.offsetWidth : 600;
  if(W < 10) W = 600;
  cv.width = W; cv.height = 220;
  var ctx = cv.getContext('2d');
  var vals = data.map(function(d){return d.acumulado;});
  var mn = 0, mx = Math.max.apply(null,vals) * 1.1 || 1000;
  var pt = {t:12,b:36,l:64,r:12};
  var cw = W-pt.l-pt.r, ch = cv.height-pt.t-pt.b;

  ctx.clearRect(0,0,W,cv.height);

  // Grid lines
  [0,0.25,0.5,0.75,1].forEach(function(f){
    var y = pt.t + ch*(1-f);
    ctx.strokeStyle='#f1f5f9'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(pt.l,y); ctx.lineTo(W-pt.r,y); ctx.stroke();
    ctx.fillStyle='#94a3b8'; ctx.font='10px -apple-system,sans-serif'; ctx.textAlign='right';
    var v = mn+(mx-mn)*f;
    ctx.fillText(v>=1000?'R$'+(v/1000).toFixed(0)+'k':'R$'+v.toFixed(0), pt.l-4, y+4);
  });

  if(data.length < 2){
    // Só um aporte — mostrar ponto
    var x = pt.l + cw/2;
    var y = pt.t + ch*(1-(vals[0]-mn)/(mx-mn));
    ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2);
    ctx.fillStyle='#6366f1'; ctx.fill();
    ctx.fillStyle='#6366f1'; ctx.font='bold 12px -apple-system,sans-serif'; ctx.textAlign='center';
    ctx.fillText('R$'+vals[0].toLocaleString('pt-BR'), x, y-12);
  } else {
    // Área preenchida
    ctx.beginPath();
    data.forEach(function(d,i){
      var x = pt.l + i/(data.length-1)*cw;
      var y = pt.t + ch*(1-(d.acumulado-mn)/(mx-mn));
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.strokeStyle='#6366f1'; ctx.lineWidth=2.5; ctx.stroke();
    // Fill area
    var lastX = pt.l + cw;
    var lastY = pt.t + ch;
    ctx.lineTo(lastX, pt.t+ch);
    ctx.lineTo(pt.l, pt.t+ch);
    ctx.closePath();
    ctx.fillStyle='rgba(99,102,241,0.1)'; ctx.fill();

    // Pontos e labels
    data.forEach(function(d,i){
      var x = pt.l + i/(data.length-1)*cw;
      var y = pt.t + ch*(1-(d.acumulado-mn)/(mx-mn));
      ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2);
      ctx.fillStyle='#6366f1'; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
      // Label data (só mostrar alguns para não poluir)
      if(data.length <= 8 || i===0 || i===data.length-1 || i%Math.ceil(data.length/6)===0){
        ctx.fillStyle='#94a3b8'; ctx.font='9px -apple-system,sans-serif'; ctx.textAlign='center';
        var parts = d.date.split('/');
        var label = parts.length===3 ? parts[1]+'/'+parts[2] : d.date;
        ctx.fillText(label, x, cv.height-6);
      }
    });

    // Valor final em destaque
    var lastD = data[data.length-1];
    var lx = pt.l + cw;
    var ly = pt.t + ch*(1-(lastD.acumulado-mn)/(mx-mn));
    ctx.fillStyle='#6366f1'; ctx.font='bold 12px -apple-system,sans-serif'; ctx.textAlign='right';
    ctx.fillText('R$'+lastD.acumulado.toLocaleString('pt-BR'), lx, ly-10);
  }
}

  ST.sst="sending";rEmail();
  loadEJS(function(ok){
    if(!ok){ST.sst="err";rEmail();return;}
    window.emailjs.init({publicKey:cfg.publicKey});
    var b=buildEmail();
    window.emailjs.send(cfg.serviceId,cfg.templateId,{to_email:cfg.toEmail,subject:b.subject,body:b.body,from_name:"CapitalOS"})
      .then(function(){var lg=[{id:Date.now(),data:new Date().toLocaleString("pt-BR"),ok:true}].concat(ST.el.slice(0,9));ST.el=lg;ss("el",lg);ST.sst="ok";toast("✅ E-mail enviado!");setTimeout(function(){ST.sst=null;rEmail();},3000);rEmail();})
      .catch(function(){ST.sst="err";setTimeout(function(){ST.sst=null;rEmail();},3000);rEmail();});
  });
}

function addWatch(ticker, nome, setor, racional){
  var wl = ST.watchlist.slice();
  if(wl.find(function(w){return w.t===ticker;})){toast("⚠️ Já está na watchlist");return;}
  wl.push({t:ticker,n:nome||ticker,s:setor||"—",r:racional||"",nota:"",added:new Date().toLocaleDateString("pt-BR")});
  sv("watchlist",wl);
  toast("✅ "+ticker+" adicionado à watchlist!");
}

function removeWatch(ticker){
  sv("watchlist", ST.watchlist.filter(function(w){return w.t!==ticker;}));
  toast("🗑️ "+ticker+" removido");
}

function updWatchNota(ticker, val){
  var wl = ST.watchlist.map(function(w){
    if(w.t===ticker){return Object.assign({},w,{nota:val});}
    return w;
  });
  ST.watchlist = wl;
  ss("wl", wl);
}

function addWatchCustom(){
  var el = document.getElementById("watch-input");
  if(!el) return;
  var val = el.value.trim().toUpperCase();
  if(!val){toast("⚠️ Digite um ticker");return;}
  addWatch(val, val, "—", "Adicionado manualmente");
  el.value = "";
}

function rWatch(){
  var wl = ST.watchlist;
  var h = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">';
  h += '<div><div class="stitle">Watchlist</div><div class="ssub">Ativos que você monitora antes de comprar</div></div>';
  h += '</div>';

  // Adicionar ativo custom
  h += '<div class="card" style="margin-bottom:14px">';
  h += '<div style="font-size:12px;font-weight:600;color:#475569;margin-bottom:10px">➕ Adicionar ativo</div>';
  h += '<div style="display:flex;gap:8px">';
  h += '<input id="watch-input" class="inp" placeholder="Ex: ARM, ASML, SNOW..." style="flex:1;font-size:14px" autocapitalize="characters" autocorrect="off"/>';
  h += '<button class="btn bp" onclick="addWatchCustom()" style="flex-shrink:0">Adicionar</button>';
  h += '</div></div>';

  // Sugestões
  var jaTemOuWatch = ASSETS.map(function(a){return a.t;}).concat(wl.map(function(w){return w.t;}));
  var sugs = WATCH_SUGESTOES.filter(function(s){return jaTemOuWatch.indexOf(s.t)===-1;}).slice(0,6);
  if(sugs.length){
    h += '<div style="font-size:12px;font-weight:600;color:#475569;margin-bottom:8px">💡 Sugestões para monitorar</div>';
    h += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">';
    sugs.forEach(function(s){
      h += '<button onclick="addWatch(\''+s.t+'\',\''+s.n+'\',\''+s.s+'\',\''+s.r+'\''+')" ';
      h += 'style="background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit">';
      h += '<span style="font-weight:700;color:#6366f1">'+s.t+'</span> <span style="color:#94a3b8">'+s.s+'</span>';
      h += '</button>';
    });
    h += '</div>';
  }

  // Lista watchlist
  if(!wl.length){
    h += '<div class="card" style="text-align:center;padding:36px">';
    h += '<div style="font-size:32px;margin-bottom:10px">👁️</div>';
    h += '<div style="font-weight:700;font-size:15px;margin-bottom:6px">Watchlist vazia</div>';
    h += '<div style="color:#94a3b8;font-size:13px">Adicione ativos que quer acompanhar antes de comprar.</div>';
    h += '</div>';
  } else {
    h += '<div style="font-size:12px;font-weight:600;color:#475569;margin-bottom:8px">'+wl.length+' ativo'+(wl.length>1?'s':'')+' monitorado'+(wl.length>1?'s':'')+'</div>';
    wl.forEach(function(w){
      var mkt = ST.mktCache[w.t];
      var ex = ST.exp["wt"+w.t];
      // Verificar se já está na carteira principal
      var naCarteira = ASSETS.find(function(a){return a.t===w.t;});
      h += '<div class="card" style="margin-bottom:8px;cursor:pointer'+(ex?';border-color:#6366f1;border-width:1.5px':'')+'" onclick="te(\'wt'+w.t+'\''+')">';
      h += '<div style="display:flex;align-items:center;gap:10px">';
      h += '<div style="width:40px;height:40px;border-radius:9px;background:#eef2ff;color:#6366f1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;flex-shrink:0">'+w.t.slice(0,4)+'</div>';
      h += '<div style="flex:1;min-width:0">';
      h += '<div style="display:flex;justify-content:space-between;align-items:center">';
      h += '<span style="font-weight:700;font-size:14px">'+w.n+'</span>';
      if(mkt&&mkt.ok){
        h += '<div style="text-align:right"><div style="font-weight:800;font-size:15px">'+(mkt.currency==="BRL"?"R$":"$")+mkt.price+'</div>'+ptag(mkt.change)+'</div>';
      } else {
        h += '<span style="font-size:11px;color:#94a3b8">Sem cotação</span>';
      }
      h += '</div>';
      h += '<div style="display:flex;gap:6px;margin-top:3px;align-items:center">';
      h += '<span style="font-size:11px;color:#6366f1;background:#eef2ff;padding:2px 7px;border-radius:99px">'+w.s+'</span>';
      if(naCarteira) h += '<span style="font-size:10px;color:#059669;background:#ecfdf5;padding:2px 7px;border-radius:99px">✓ Na carteira</span>';
      h += '<span style="font-size:10px;color:#94a3b8">desde '+w.added+'</span>';
      h += '</div></div>';
      h += '<div style="color:#94a3b8;font-size:13px;margin-left:4px">'+(ex?'▲':'▼')+'</div>';
      h += '</div>';

      if(ex){
        h += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid #f1f5f9">';
        // Racional
        h += '<div style="font-size:12px;color:#475569;line-height:1.7;margin-bottom:10px;background:#f8fafc;border-radius:8px;padding:9px 12px">💡 '+w.r+'</div>';
        // Nota pessoal
        h += '<div style="font-size:11px;color:#94a3b8;margin-bottom:5px">📝 Sua nota</div>';
        h += '<textarea onclick="event.stopPropagation()" oninput="event.stopPropagation();updWatchNota(\''+w.t+'\',this.value)" ';
        h += 'placeholder="Por que está monitorando? Qual preço de entrada ideal?" ';
        h += 'style="width:100%;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:8px;padding:9px;font-size:12px;font-family:inherit;color:#0f172a;outline:none;resize:none;height:60px;line-height:1.6">'+w.nota+'</textarea>';
        // Botões de ação
        h += '<div style="display:flex;gap:8px;margin-top:10px">';
        h += '<button class="btn bp bsm" style="flex:1" onclick="event.stopPropagation();addToMainCart(\''+w.t+'\')">↑ Adicionar à carteira</button>';
        h += '<button class="btn bsm" style="background:#fef2f2;border:1.5px solid #fca5a5;color:#dc2626;flex-shrink:0" onclick="event.stopPropagation();removeWatch(\''+w.t+'\')">🗑️ Remover</button>';
        h += '</div></div>';
      }
      h += '</div>';
    });
  }

  document.getElementById("p-watch").innerHTML = h;
}

}
